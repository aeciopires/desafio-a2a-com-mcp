# Fixed UIDs (prometheus, jaeger, loki): dashboards and cross-links reference them.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # Metric -> trace: exemplar points open the trace in Jaeger.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    jsonData:
      # Trace -> logs: "Logs for this span" opens Loki filtered by the trace id.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{service="$${__span.tags["service.name"]}"} | trace_id="$${__trace.traceId}"'
        tags:
          - key: service.name
            value: service
      # Trace -> metrics: request rate and latency of the span's service.
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        tags:
          - key: service.name
            value: job
        queries:
          - name: Requisicoes MCP por segundo
            query: 'sum(rate(mcp_requests_total{$$__tags}[1m])) or sum(rate(a2a_requests_total{$$__tags}[1m]))'
          - name: Latencia p95 (s)
            query: 'histogram_quantile(0.95, sum by (le) (rate(mcp_request_duration_seconds_bucket{$$__tags}[5m]))) or histogram_quantile(0.95, sum by (le) (rate(a2a_request_duration_seconds_bucket{$$__tags}[5m])))'
      nodeGraph:
        enabled: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # Log -> trace: the trace_id structured metadata becomes a link to Jaeger.
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: jaeger
          url: "$${__value.raw}"
          urlDisplayLabel: Ver trace no Jaeger
        - name: TraceIDInLine
          matcherType: regex
          matcherRegex: '"trace_id":\s*"(\w+)"'
          datasourceUid: jaeger
          url: "$${__value.raw}"
          urlDisplayLabel: Ver trace no Jaeger

[project]
name = "servidor-mcp"
dynamic = ["version"]  # the version lives in ../VERSION (single source of truth)
description = "MCP server (Streamable HTTP, stateless) exposing the Hill Valley Tech meeting rooms."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "mcp==2.3.0",
    "pydantic==2.14.1",
    "starlette==1.8.0",
    "uvicorn==0.54.0",
    "prometheus-client==0.26.0",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff==0.17.1",
]

[tool.uv]
# Not built as a distribution: the code runs from src/ and the version comes from ../VERSION.
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
